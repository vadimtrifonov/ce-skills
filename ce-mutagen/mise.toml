[tools]
dotnet = "10"

[bootstrap.repos]
"tools/Mutagen" = { url = "https://github.com/Mutagen-Modding/Mutagen.git", ref = "dev" }

[env]
MUTAGEN_ROOT = "{{ config_root }}/tools/Mutagen"

[tasks.setup]
description = "Install or update the current Mutagen source"
run = "mise bootstrap repos update --yes"

[tasks.scratch]
description = "Create a temporary scratch project"
quiet = true
raw_args = true
run = "pwsh -NoProfile -File scripts/New-Scratch.ps1"

[tasks.test]
description = "Test the scratch scaffold"
run = "pwsh -NoProfile -File tests/Test-ScratchProject.ps1"

[tasks.check]
description = "Run tests and exercise generated scratch workflows"
timeout = "10m"
run = "pwsh -NoProfile -File tests/Test-ScratchProject.ps1 -Integration"
